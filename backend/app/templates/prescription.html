<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font-family: sans-serif; color: #1a1a1a; margin: 40px; }
    .header { border-bottom: 2px solid #1a1a1a; padding-bottom: 12px; margin-bottom: 24px; }
    .clinic-name { font-size: 22px; font-weight: bold; }
    .meta-table { width: 100%; margin-bottom: 24px; }
    .meta-table td { padding: 4px 0; vertical-align: top; }
    .meta-label { color: #555; width: 160px; }
    .notes-block { border: 1px solid #ccc; padding: 16px; min-height: 120px; white-space: pre-wrap; }
    .footer { margin-top: 40px; font-size: 12px; color: #777; }
</style>
</head>
<body>
    <div class="header">
        <div class="clinic-name">MediQueue Clinic</div>
        <div>Prescription</div>
    </div>

    <table class="meta-table">
        <tr><td class="meta-label">Patient</td><td>{{ patient_name }}</td></tr>
        <tr><td class="meta-label">Doctor</td><td>{{ doctor_name }} ({{ doctor_specialization }})</td></tr>
        <tr><td class="meta-label">Appointment Date</td><td>{{ appointment_time }}</td></tr>
        <tr><td class="meta-label">Urgency Level</td><td>{{ urgency_level }}</td></tr>
    </table>

    <div class="notes-block">{{ notes }}</div>

    <div class="footer">Generated by MediQueue &middot; {{ generated_at }}</div>
</body>
</html>
